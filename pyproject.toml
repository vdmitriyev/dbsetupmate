[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dbsetupmate"
description = "`dbsetupmate` overtakes a role of a database mate, whose purpose is to create and maintain database schemas and users"
version = "0.8.1"
readme = "README.md"
authors = [
  {name = "vdmitriyev"}
]
maintainers = [
  {name = "vdmitriyev"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.0.0",
    "psycopg2-binary>=2.9.10"
]

[project.scripts]
dbsetupmate = "dbsetupmate.cli:app"
dbsmate = "dbsetupmate.cli:app"

[project.urls]

homepage = "https://github.com/vdmitriyev/dbsetupmate"
changelog = "https://github.com/vdmitriyev/dbsetupmate/blob/main/HISTORY.rst"
repository = "https://github.com/vdmitriyev/dbsetupmate.git"
documentation = "https://vdmitriyev.github.io/dbsetupmate/"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbsetupmate*"]

[tool.setuptools.package-data]
dbsetupmate = ["py.typed"]

# Keep `task py:black` and the pre-commit hook (--line-length 120) in agreement.
[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live PostgreSQL (see compose-tests.yaml)",
]
# Keep a bare `pytest` green without Docker; run the rest with `pytest -m integration`.
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "black>=26.3.1",
    "isort>=8.0.1",
    "pre-commit>=4.5.1",
    "bandit>=1.9.4",
    "pylint>=4.0.5",
    "pytest>=9.0.3"
]

[tool.uv]
exclude-newer = "8 days"
