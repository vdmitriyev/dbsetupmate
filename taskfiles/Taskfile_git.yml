version: '3'

vars:
  COMMIT_DATE:
    sh: git log -1 --format=%ad --date=short
  COMMIT_HASH:
    sh: git log -1 --format="%h"
  COMMITS_COUNTER:
    #sh: git tag --list | wc -l
    sh: git rev-list --all --count
  PACKAGE_VERSION: "{{.COMMIT_DATE}}_{{.COMMITS_COUNTER}}_{{.COMMIT_HASH}}"
  FILE_VERSION_TXT: "version.txt"

tasks:

  tag-create:
    desc: creates a new git tag
    aliases: [gtc]
    silent: true
    cmds:
      - task: package-version
      - git tag v{{.PACKAGE_VERSION}}
      - echo "latest git tag"
      - git describe --tags --abbrev=0
      - task: tag-save-file

  tag-save-file:
    desc: saves a new git tag into file
    aliases: [gtsf]
    silent: true
    cmds:
      - git describe --tags --abbrev=0 > {{.FILE_VERSION_TXT}}

  tag-re-create:
    desc: re-creates a new git tag
    aliases: [gtrc]
    silent: true
    cmds:
      - git tag -d v{{.PACKAGE_VERSION}}
      - task: tag-create

  tag-show:
    desc: shows all git tags
    aliases: [gts]
    silent: true
    cmds:
      - echo "List of git tags:"
      - git tag
      - echo ""
      - echo "Latest git tag:"
      - git describe --tags --abbrev=0

  tag-push:
    desc: pushes all git tags to remote
    aliases: [gtp]
    silent: true
    cmds:
        - git push --tags origin

  package-version:
    desc: shows current package version
    aliases: [pv, version]
    silent: true
    cmds:
      - echo "Current package version -> v{{.PACKAGE_VERSION}}"
      - echo